[project]
name = "gtm-mcp-server"
version = "0.1.0"
description = "An MCP server exposing go-to-market enrichment and CRM capabilities as agent-callable tools."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "vivz-git" }]
keywords = ["mcp", "model-context-protocol", "gtm", "revops", "crm", "enrichment"]

dependencies = [
    # Official Model Context Protocol Python SDK (v2 line).
    # Pinned <3 deliberately: v1 -> v2 was a breaking rename (FastMCP -> MCPServer),
    # so a future v3 must be an explicit, reviewed migration. See DECISIONS.md D-002.
    "mcp[cli]>=2.1.1,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    # Async Postgres access for the mock CRM.
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30",
    "alembic>=1.16",
    # Structured logging; the audit trail is emitted as machine-readable events.
    "structlog>=25.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "anyio>=4.10",
    "ruff>=0.16",
    "mypy>=1.18",
]

[project.scripts]
# Entry point used by MCP clients (Claude Desktop / Claude Code) over stdio.
gtm-mcp-server = "gtm_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/vivz-git/gtm-mcp-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_mcp"]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "PTH",      # prefer pathlib
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit security rules
    "ANN",      # require type annotations
    "D",        # docstrings
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # allow Any in narrow, documented spots
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, skip docstrings, and hardcode fixture "secrets".
"tests/**" = ["S101", "S105", "D100", "D101", "D102", "D103", "D104", "ANN201", "ANN001"]
"eval/**" = ["S101", "S105", "ANN401", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "eval"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: fast, no I/O, no database",
    "integration: requires a live PostgreSQL instance (docker compose up -d db)",
    "mcp: exercises the server through a real in-memory MCP client session",
    "e2e: spawns the server as a real stdio subprocess, the way an MCP host does",
    "eval: agent tool-selection evaluations; slow, not part of the default gate",
    "settings(**overrides): configuration a test's server should be built with",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/gtm_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
